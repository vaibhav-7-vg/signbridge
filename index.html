<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SignBridge Dataset Collector</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #172033;
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.camera-box {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: black;
    border-radius: 18px;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
}

.panel {
    background: white;
    margin-top: 20px;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

select {
    padding: 12px;
    font-size: 17px;
    border-radius: 8px;
    margin: 10px;
}

button {
    border: none;
    padding: 13px 20px;
    border-radius: 10px;
    font-size: 16px;
    color: white;
    margin: 5px;
    cursor: pointer;
}

.start {
    background: #2563eb;
}

.capture {
    background: #16a34a;
}

.download {
    background: #7c3aed;
}

.clear {
    background: #dc2626;
}

#result {
    font-size: 24px;
    font-weight: bold;
    margin: 15px;
}

.counter {
    margin-top: 15px;
    line-height: 1.8;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

</head>

<body>

<header>
    <h1>🤟 SignBridge</h1>
    <p>AI Training Data Collector</p>
</header>

<div class="container">

    <div class="camera-box">

        <video id="video" autoplay playsinline></video>

        <canvas id="canvas"></canvas>

    </div>

    <div class="panel">

        <h2>Select Sign</h2>

        <select id="label">

            <option value="HELLO">HELLO</option>

            <option value="THANK_YOU">
                THANK YOU
            </option>

            <option value="YES">YES</option>

            <option value="NO">NO</option>

            <option value="HELP">HELP</option>

        </select>

        <br>

        <button class="start" onclick="startCamera()">
            📷 Start Camera
        </button>

        <button class="capture" onclick="captureData()">
            📸 Capture
        </button>

        <button class="download" onclick="downloadData()">
            ⬇️ Download Dataset
        </button>

        <button class="clear" onclick="clearData()">
            🗑️ Clear Dataset
        </button>

        <div id="result">
            Camera not started
        </div>

        <div class="counter" id="counter">
            HELLO: 0<br>
            THANK YOU: 0<br>
            YES: 0<br>
            NO: 0<br>
            HELP: 0
        </div>

    </div>

</div>

<script>

const video = document.getElementById("video");

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

const result = document.getElementById("result");

let latestLandmarks = null;

let dataset = JSON.parse(
    localStorage.getItem("signbridgeDataset") || "[]"
);


/* ================================
   MEDIAPIPE
================================ */

const hands = new Hands({

    locateFile: (file) => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

});

hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


hands.onResults((results) => {

    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ) {

        latestLandmarks =
            results.multiHandLandmarks[0];

        result.innerText =
            "✋ Hand detected - Ready to capture";

        result.style.color = "#16a34a";


        drawConnectors(
            ctx,
            latestLandmarks,
            HAND_CONNECTIONS,
            {
                color: "#00FF00",
                lineWidth: 4
            }
        );


        drawLandmarks(
            ctx,
            latestLandmarks,
            {
                color: "#FF0000",
                lineWidth: 2,
                radius: 5
            }
        );

    }

    else {

        latestLandmarks = null;

        result.innerText =
            "Show your hand ✋";

        result.style.color =
            "#2563eb";

    }

    updateCounter();

});


/* ================================
   CAMERA
================================ */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user"
                },

                audio: false

            });


        video.srcObject = stream;


        const camera =
            new Camera(video, {

                onFrame: async () => {

                    await hands.send({
                        image: video
                    });

                },

                width: 640,

                height: 480

            });


        camera.start();


        result.innerText =
            "Show your hand ✋";

    }

    catch(error) {

        console.error(error);

        result.innerText =
            "Camera error ❌";

    }

}


/* ================================
   CAPTURE LANDMARK DATA
================================ */

function captureData() {

    if (!latestLandmarks) {

        alert(
            "No hand detected. Show your hand first."
        );

        return;

    }


    const label =
        document.getElementById("label").value;


    /*
       Convert 21 landmarks into
       simple X/Y/Z values.
    */

    const landmarks =
        latestLandmarks.map(point => ({

            x: point.x,

            y: point.y,

            z: point.z

        }));


    dataset.push({

        label: label,

        landmarks: landmarks,

        time: Date.now()

    });


    localStorage.setItem(
        "signbridgeDataset",
        JSON.stringify(dataset)
    );


    result.innerText =
        "✅ Captured " + label;


    updateCounter();

}


/* ================================
   COUNTER
================================ */

function updateCounter() {

    const counts = {

        HELLO: 0,

        THANK_YOU: 0,

        YES: 0,

        NO: 0,

        HELP: 0

    };


    dataset.forEach(item => {

        if (counts[item.label] !== undefined) {

            counts[item.label]++;

        }

    });


    document.getElementById("counter").innerHTML =

        "HELLO: " + counts.HELLO + "<br>" +

        "THANK YOU: " + counts.THANK_YOU + "<br>" +

        "YES: " + counts.YES + "<br>" +

        "NO: " + counts.NO + "<br>" +

        "HELP: " + counts.HELP;

}


/* ================================
   DOWNLOAD DATASET
================================ */

function downloadData() {

    if (dataset.length === 0) {

        alert("Dataset is empty.");

        return;

    }


    const data =
        JSON.stringify(dataset, null, 2);


    const blob =
        new Blob(
            [data],
            {type: "application/json"}
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download =
        "signbridge_dataset.json";


    a.click();


    URL.revokeObjectURL(url);

}


/* ================================
   CLEAR DATASET
================================ */

function clearData() {

    if (
        confirm(
            "Delete all collected data?"
        )
    ) {

        dataset = [];

        localStorage.removeItem(
            "signbridgeDataset"
        );

        updateCounter();

        result.innerText =
            "Dataset cleared";

    }

}


updateCounter();

</script>

</body>
</html>
