<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SignBridge - Sign Language Translator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
            min-height: 100vh;
        }

        header {
            background: #172033;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 6px;
            opacity: 0.8;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .camera-box {
            background: black;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .status {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .status h2 {
            margin-bottom: 10px;
        }

        #result {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
            margin-top: 10px;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .info {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .info h3 {
            margin-bottom: 10px;
        }

        .info p {
            line-height: 1.6;
            color: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>🤟 SignBridge</h1>
    <p>Sign Language → Text</p>
</header>

<div class="container">

    <div class="camera-box">
        <video id="camera" autoplay playsinline></video>
    </div>

    <div class="status">

        <h2>Recognition Result</h2>

        <div id="result">
            Camera not started
        </div>

        <button onclick="startCamera()">
            📷 Start Camera
        </button>

    </div>

    <div class="info">

        <h3>About SignBridge</h3>

        <p>
            SignBridge is an AI-based project designed to recognize
            sign language and convert it into text so that communication
            between sign-language users and other people becomes easier.
        </p>

    </div>

</div>

<script>

const video = document.getElementById("camera");
const result = document.getElementById("result");

async function startCamera() {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            },
            audio: false
        });

        video.srcObject = stream;

        result.innerText = "Camera working ✅";

    } catch (error) {

        console.error(error);

        result.innerText =
            "Camera permission denied ❌";

    }

}

</script>

</body>
</html>
