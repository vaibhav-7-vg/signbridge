<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SignBridge AI</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
    text-align: center;
}

header {
    background: #172033;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

.camera {
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: auto;
    background: black;
    border-radius: 18px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
    transform: scaleX(-1);
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
}

.card {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 18px;
}

#result {
    font-size: 32px;
    font-weight: bold;
    color: #2563eb;
    margin: 20px;
}

button {
    padding: 14px 22px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    margin: 5px;
}

#status {
    margin-top: 15px;
    color: #555;
}

</style>

<!-- MediaPipe Hands -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<!-- ONNX -->

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

</head>


<body>


<header>

<h1>🤟 SignBridge</h1>

<p>Sign Language → Text</p>

</header>


<div class="container">


<div class="camera">

<video
id="video"
autoplay
playsinline>
</video>

<canvas id="canvas"></canvas>

</div>


<div class="card">

<h2>Recognized Sign</h2>

<div id="result">

Starting...

</div>

<div id="status">

Loading AI...

</div>

<br>

<button onclick="startCamera()">

📷 Start Camera

</button>

</div>


</div>


<script>


/* =====================================
   ELEMENTS
===================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const result =
document.getElementById("result");

const status =
document.getElementById("status");


/* =====================================
   AI FILES
===================================== */

const MODEL_URL =
"https://raw.githubusercontent.com/vaibhav-7-vg/signbridge/main/signbridge_model.onnx";

const LABEL_URL =
"https://raw.githubusercontent.com/vaibhav-7-vg/signbridge/main/labels.json";


let session = null;

let labels = [];

let cameraStarted = false;


/* =====================================
   LOAD AI
===================================== */

async function loadAI() {

try {

status.innerText =
"Loading labels...";


const response =
await fetch(LABEL_URL);


if (!response.ok) {

throw new Error(
"labels.json could not be loaded"
);

}


labels =
await response.json();


status.innerText =
"Loading AI model...";


session =
await ort.InferenceSession.create(
MODEL_URL
);


console.log(
"AI MODEL LOADED",
session
);


status.innerText =
"AI model ready ✅";

result.innerText =
"Show your hand ✋";


}

catch(error) {

console.error(
"AI ERROR:",
error
);

status.innerText =
"AI ERROR ❌";

result.innerText =
error.message;

}

}


/* =====================================
   MEDIAPIPE
===================================== */

const hands =
new Hands({

locateFile: function(file) {

return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file;

}

});


hands.setOptions({

maxNumHands: 1,

modelComplexity: 1,

minDetectionConfidence: 0.5,

minTrackingConfidence: 0.5

});


/* =====================================
   HAND RESULT
===================================== */

hands.onResults(
function(results) {


canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


if (
!results.multiHandLandmarks ||
results.multiHandLandmarks.length === 0
) {

result.innerText =
"Show your hand ✋";

return;

}


/* Hand found */

result.innerText =
"Hand detected 🤟";


const landmarks =
results.multiHandLandmarks[0];


/* Draw */

drawConnectors(
ctx,
landmarks,
HAND_CONNECTIONS,
{
color: "#00FF00",
lineWidth: 4
}
);


drawLandmarks(
ctx,
landmarks,
{
color: "#FF0000",
lineWidth: 2
}
);


/* =====================================
   FEATURES
===================================== */

const features = [];


for (
let i = 0;
i < landmarks.length;
i++
) {

features.push(
landmarks[i].x
);

features.push(
landmarks[i].y
);

features.push(
landmarks[i].z
);

}


/* =====================================
   AI PREDICTION
===================================== */

if (!session) {

return;

}


try {


const input =
new ort.Tensor(
"float32",
Float32Array.from(features),
[1,63]
);


const output =
session.run({

float_input:
input

});


/*
Important:
session.run() is asynchronous.
*/

output.then(
function(resultData) {


const label =
resultData["output_label"];


if (!label) {

return;

}


const index =
Number(
label.data[0]
);
/* =====================================
   AI PREDICTION
===================================== */

if (!session) {

    result.innerText =
        "AI model not loaded";

    return;

}

try {

    const input =
        new ort.Tensor(
            "float32",
            Float32Array.from(features),
            [1, 63]
        );

    const output =
        await session.run({

            "float_input": input

        });

    console.log(
        "MODEL OUTPUT:",
        output
    );

    const label =
        output["output_label"];

    if (!label) {

        throw new Error(
            "output_label not found"
        );

    }

    const index =
        Number(label.data[0]);

    console.log(
        "PREDICTED CLASS:",
        index
    );

    if (
        index >= 0 &&
        index < labels.length
    ) {

        result.innerText =
            labels[index];

        status.innerText =
            "AI prediction ✅";

    }

} catch (error) {

    console.error(
        "PREDICTION ERROR:",
        error
    );

    result.innerText =
        "Prediction error ❌";

    status.innerText =
        error.message ||
        String(error);

}
/* =====================================
   CAMERA
===================================== */

async function startCamera() {


if (cameraStarted) {

return;

}


try {


status.innerText =
"Opening camera...";


const stream =
await navigator.mediaDevices
.getUserMedia({

video: {
facingMode: "user"
},

audio: false

});


video.srcObject =
stream;


await video.play();


const camera =
new Camera(

video,

{

onFrame:
async function() {

await hands.send({

image: video

});

},

width: 640,

height: 480

}

);


camera.start();


cameraStarted =
true;


status.innerText =
"Camera running ✅";


}

catch(error) {

console.error(
"Camera error:",
error
);

status.innerText =
"Camera error ❌";

result.innerText =
error.message;

}

}


/* =====================================
   START
===================================== */

loadAI();


</script>


</body>

</html>
