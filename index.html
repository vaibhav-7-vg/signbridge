<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SignBridge AI</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #172033;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    font-size: 30px;
}

header p {
    margin-top: 5px;
    opacity: .8;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.camera-box {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: black;
    border-radius: 18px;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
}

.panel {
    background: white;
    margin-top: 20px;
    padding: 25px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

#result {
    font-size: 32px;
    font-weight: bold;
    margin: 20px 0;
    color: #2563eb;
}

#confidence {
    color: #666;
    margin-bottom: 15px;
}

button {
    border: none;
    padding: 14px 22px;
    border-radius: 10px;
    font-size: 16px;
    color: white;
    background: #2563eb;
    cursor: pointer;
}

button:active {
    transform: scale(.97);
}

.status {
    margin-top: 15px;
    color: #555;
}

</style>

<!-- MediaPipe -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<!-- ONNX Runtime -->

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

</head>

<body>

<header>

<h1>🤟 SignBridge</h1>

<p>Indian Sign Language Recognition</p>

</header>


<div class="container">


<div class="camera-box">

<video id="video"
       autoplay
       playsinline>
</video>

<canvas id="canvas"></canvas>

</div>


<div class="panel">

<h2>Recognized Sign</h2>

<div id="result">

Loading AI...

</div>

<div id="confidence">

Please wait...

</div>

<button onclick="startCamera()">

📷 Start Camera

</button>

<div class="status"
     id="status">

Loading model...

</div>

</div>

</div>


<script>

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const result =
document.getElementById("result");

const confidence =
document.getElementById("confidence");

const status =
document.getElementById("status");


let session = null;

let labels = [];

let latestPrediction = "";

let cameraStarted = false;


/* ===================================
   LOAD MODEL
=================================== */

async function loadModel() {

    try {

        status.innerText =
        "Loading AI model...";

        labels = await fetch(
            "labels.json"
        ).then(
            response => response.json()
        );


        session =
        await ort.InferenceSession.create(
            "signbridge_model.onnx"
        );


        status.innerText =
        "AI model loaded successfully ✅";

        result.innerText =
        "Show your sign 🤟";

        confidence.innerText =
        "";

    }

    catch(error) {

        console.error(error);

        status.innerText =
        "Model loading failed ❌";

        result.innerText =
        "AI unavailable";

    }

}


/* ===================================
   MEDIAPIPE HANDS
=================================== */

const hands =
new Hands({

    locateFile: (file) => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

});


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


/* ===================================
   HAND RESULTS
=================================== */

hands.onResults(async (results) => {


    canvas.width =
    video.videoWidth;

    canvas.height =
    video.videoHeight;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ) {

        result.innerText =
        "Show your hand ✋";

        confidence.innerText =
        "";

        return;

    }


    const landmarks =
    results.multiHandLandmarks[0];


    /* Draw hand */

    drawConnectors(
        ctx,
        landmarks,
        HAND_CONNECTIONS,
        {
            color: "#00FF00",
            lineWidth: 4
        }
    );


    drawLandmarks(
        ctx,
        landmarks,
        {
            color: "#FF0000",
            lineWidth: 2,
            radius: 5
        }
    );


    /* ===================================
       CREATE 63 FEATURES
    =================================== */

    const features = [];


    for (
        const point of landmarks
    ) {

        features.push(point.x);

        features.push(point.y);

        features.push(point.z);

    }


    if (!session) {

        return;

    }


    try {

        const input =
        new ort.Tensor(
            "float32",
            Float32Array.from(features),
            [1, 63]
        );


        const inputName =
        session.inputNames[0];


        const output =
        await session.run({

            [inputName]: input

        });


        
const output = await session.run({
    [inputName]: input
});

const predictedLabelTensor = output["output_label"];

let predictedIndex = Number(
    predictedLabelTensor.data[0]
);

if (
    predictedIndex >= 0 &&
    predictedIndex < labels.length
) {
    result.innerText = labels[predictedIndex];

    confidence.innerText =
        "AI prediction ✅";
      }
    catch(error) {

        console.error(error);

        status.innerText =
        "Prediction error";

    }

});


/* ===================================
   START CAMERA
=================================== */

async function startCamera() {


    if (cameraStarted) {

        return;

    }


    try {


        const stream =
        await navigator.mediaDevices.getUserMedia({

            video: {

                facingMode: "user"

            },

            audio: false

        });


        video.srcObject =
        stream;


        const camera =
        new Camera(
            video,
            {

                onFrame:
                async () => {

                    await hands.send({

                        image: video

                    });

                },

                width: 640,

                height: 480

            }
        );


        camera.start();


        cameraStarted =
        true;


        status.innerText =
        "Camera + AI running ✅";


    }

    catch(error) {

        console.error(error);

        status.innerText =
        "Camera permission denied ❌";

    }

}


/* ===================================
   START MODEL
=================================== */

loadModel();

</script>

</body>
</html>
