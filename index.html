<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SignBridge AI</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #172033;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    font-size: 30px;
}

header p {
    margin-top: 6px;
    opacity: 0.8;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.camera-box {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: black;
    border-radius: 18px;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

canvas {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    transform: scaleX(-1);
}

.panel {
    background: white;

    margin-top: 20px;

    padding: 25px;

    border-radius: 18px;

    text-align: center;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.08);
}

#result {

    font-size: 32px;

    font-weight: bold;

    margin: 20px 0;

    color: #2563eb;

    min-height: 40px;
}

#confidence {

    color: #666;

    margin-bottom: 15px;

    min-height: 20px;
}

button {

    border: none;

    padding: 14px 22px;

    border-radius: 10px;

    font-size: 16px;

    color: white;

    background: #2563eb;

    cursor: pointer;
}

button:active {

    transform: scale(0.97);
}

.status {

    margin-top: 15px;

    color: #555;

    min-height: 25px;
}

.sentence-box {

    margin-top: 20px;

    padding: 20px;

    background: #ffffff;

    border-radius: 18px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.08);

    text-align: center;
}

.sentence {

    margin-top: 12px;

    min-height: 50px;

    padding: 12px;

    background: #f1f5f9;

    border-radius: 10px;

    font-size: 20px;

    font-weight: bold;

    word-wrap: break-word;
}

.small-buttons {

    margin-top: 15px;
}

.small-buttons button {

    background: #475569;

    margin: 4px;

}

</style>


<!-- =========================
     MEDIAPIPE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<!-- =========================
     ONNX RUNTIME
========================= -->

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

</head>


<body>


<header>

<h1>🤟 SignBridge</h1>

<p>Indian Sign Language Recognition</p>

</header>


<div class="container">


<!-- =========================
     CAMERA
========================= -->

<div class="camera-box">

<video
    id="video"
    autoplay
    playsinline>
</video>

<canvas id="canvas"></canvas>

</div>


<!-- =========================
     AI RESULT
========================= -->

<div class="panel">

<h2>Recognized Sign</h2>

<div id="result">

Loading AI...

</div>

<div id="confidence">

Please wait...

</div>


<button onclick="startCamera()">

📷 Start Camera

</button>


<div
    class="status"
    id="status">

Loading AI model...

</div>

</div>


<!-- =========================
     SENTENCE
========================= -->

<div class="sentence-box">

<h2>📝 Sentence</h2>

<div
    class="sentence"
    id="sentence">

Your sentence will appear here.

</div>


<div class="small-buttons">

<button onclick="addWord()">
➕ Add Sign
</button>

<button onclick="clearSentence()">
🗑️ Clear
</button>

<button onclick="speakSentence()">
🔊 Speak
</button>

</div>

</div>


</div>


<script>


/* =====================================================
   BASIC ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const result =
    document.getElementById("result");

const confidence =
    document.getElementById("confidence");

const status =
    document.getElementById("status");

const sentenceElement =
    document.getElementById("sentence");


/* =====================================================
   VARIABLES
===================================================== */

let session = null;

let labels = [];

let cameraStarted = false;

let latestPrediction = "";

let sentence = [];


/* =====================================================
   LOAD LABELS + MODEL
===================================================== */

async function loadModel() {

    try {

        status.innerText =
            "Loading labels...";


        /* Load labels */

        const labelResponse =
            await fetch("./labels.json");


        if (!labelResponse.ok) {

            throw new Error(
                "Could not load labels.json"
            );

        }


        labels =
            await labelResponse.json();


        console.log(
            "Labels:",
            labels
        );


        /* Load ONNX model */

        status.innerText =
            "Loading AI model...";


        session =
            await ort.InferenceSession.create(
                "./signbridge_model.onnx"
            );


        console.log(
            "Model loaded:",
            session
        );


        console.log(
            "Input names:",
            session.inputNames
        );


        console.log(
            "Output names:",
            session.outputNames
        );


        status.innerText =
            "AI model loaded successfully ✅";


        result.innerText =
            "Show your sign 🤟";


        confidence.innerText =
            "Ready";


    }

    catch (error) {

        console.error(
            "MODEL LOADING ERROR:",
            error
        );


        status.innerText =
            "MODEL ERROR ❌";


        result.innerText =
            error.message ||
            String(error);


        confidence.innerText =
            "Check GitHub model file";


    }

}


/* =====================================================
   MEDIAPIPE HANDS
===================================================== */

const hands =
    new Hands({

        locateFile: (file) => {

            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

        }

    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


/* =====================================================
   HAND DETECTION RESULTS
===================================================== */

hands.onResults(
    async (results) => {

        try {


            /* Set canvas size */

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /* No hand */

            if (
                !results.multiHandLandmarks ||
                results.multiHandLandmarks.length === 0
            ) {

                result.innerText =
                    "Show your hand ✋";

                confidence.innerText =
                    "";

                return;

            }


            /* Get first hand */

            const landmarks =
                results.multiHandLandmarks[0];


            /* Draw connections */

            drawConnectors(

                ctx,

                landmarks,

                HAND_CONNECTIONS,

                {
                    color: "#00FF00",

                    lineWidth: 4
                }

            );


            /* Draw points */

            drawLandmarks(

                ctx,

                landmarks,

                {
                    color: "#FF0000",

                    lineWidth: 2,

                    radius: 5
                }

            );


            /* =========================================
               CREATE 63 FEATURES
            ========================================= */

            const features = [];


            for (
                const point of landmarks
            ) {

                features.push(
                    point.x
                );

                features.push(
                    point.y
                );

                features.push(
                    point.z
                );

            }


            /* Check model */

            if (!session) {

                result.innerText =
                    "AI model not ready";

                return;

            }


            /* =========================================
               CREATE ONNX INPUT
            ========================================= */

            const input =
                new ort.Tensor(

                    "float32",

                    Float32Array.from(
                        features
                    ),

                    [1, 63]

                );


            /* Get input name */

            const inputName =
                session.inputNames[0];


            /* =========================================
               RUN AI MODEL
            ========================================= */

            const output =
                await session.run({

                    [inputName]:
                        input

                });


            console.log(
                "Prediction output:",
                output
            );
              console.log(
    "Output label:",
    output["output_label"]
);

console.log(
    "Output label data:",
    output["output_label"].data
);

console.log(
    "Input features:",
    features
);


            /* =========================================
               GET output_label
            ========================================= */

            const predictedLabelTensor =
                output["output_label"];


            if (!predictedLabelTensor) {

                throw new Error(
                    "output_label not found"
                );

            }


            /* Get class number */

            const predictedIndex =
                Number(
                    predictedLabelTensor.data[0]
                );


            console.log(
                "Predicted index:",
                predictedIndex
            );


            /* =========================================
               CONVERT NUMBER → SIGN
            ========================================= */

            if (
                predictedIndex >= 0 &&
                predictedIndex < labels.length
            ) {

                latestPrediction =
                    labels[predictedIndex];


                result.innerText =
                    latestPrediction;


                confidence.innerText =
                    "AI prediction ✅";


            }

            else {

                result.innerText =
                    "Unknown sign";

                confidence.innerText =
                    "Invalid prediction";

            }

        }

        catch (error) {

    console.error("PREDICTION ERROR:", error);

    status.innerText = "Prediction error ❌";

    result.innerText = "ERROR: " + (
        error.message || String(error)
    );

    confidence.innerText =
        "AI prediction failed";
        }
);


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {


    if (cameraStarted) {

        return;

    }


    try {


        status.innerText =
            "Starting camera...";


        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "user"

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        /* Wait for video */

        await video.play();


        /* MediaPipe camera */

        const camera =
            new Camera(

                video,

                {

                    onFrame:
                    async () => {

                        await hands.send({

                            image:
                                video

                        });

                    },

                    width: 640,

                    height: 480

                }

            );


        camera.start();


        cameraStarted =
            true;


        status.innerText =
            "Camera + AI running ✅";


    }

    catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );


        status.innerText =
            "Camera error ❌";


        result.innerText =
            error.message ||
            String(error);

    }

}


/* =====================================================
   ADD CURRENT SIGN TO SENTENCE
===================================================== */

function addWord() {


    if (
        !latestPrediction ||
        latestPrediction === "Unknown sign"
    ) {

        return;

    }


    sentence.push(
        latestPrediction
    );


    updateSentence();

}


/* =====================================================
   UPDATE SENTENCE
===================================================== */

function updateSentence() {

    sentenceElement.innerText =
        sentence.join(" ");

}


/* =====================================================
   CLEAR SENTENCE
===================================================== */

function clearSentence() {

    sentence = [];

    updateSentence();

}


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speakSentence() {


    if (sentence.length === 0) {

        return;

    }


    const text =
        sentence.join(" ");


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "en-IN";


    window.speechSynthesis.speak(
        speech
    );

}


/* =====================================================
   START
===================================================== */

loadModel();


</script>

</body>

</html>
