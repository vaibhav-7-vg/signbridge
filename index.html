<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SignBridge - Sign Language to Text</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #172033;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 8px 0 0;
    opacity: 0.85;
}

.container {
    width: 92%;
    max-width: 800px;
    margin: auto;
    padding: 20px 0;
}

.camera-box {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: black;
    border-radius: 18px;
    overflow: hidden;
}

#video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

#canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
}

.card {
    background: white;
    margin-top: 18px;
    padding: 22px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

#result {
    min-height: 45px;
    margin: 18px 0;
    font-size: 32px;
    font-weight: bold;
    color: #2563eb;
}

#status {
    min-height: 25px;
    color: #555;
    margin-top: 12px;
}

#confidence {
    min-height: 22px;
    color: #777;
    margin-bottom: 12px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 14px 22px;
    margin: 5px;
    background: #2563eb;
    color: white;
    font-size: 16px;
}

button:active {
    transform: scale(0.97);
}

.sentence {
    min-height: 55px;
    padding: 15px;
    margin-top: 12px;
    border-radius: 10px;
    background: #f1f5f9;
    font-size: 20px;
    font-weight: bold;
    word-wrap: break-word;
}

</style>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<!-- MediaPipe Drawing -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<!-- MediaPipe Camera -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<!-- ONNX Runtime Web -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

</head>


<body>

<header>

<h1>🤟 SignBridge</h1>

<p>Sign Language → Text</p>

</header>


<div class="container">


<!-- CAMERA -->

<div class="camera-box">

<video
id="video"
autoplay
playsinline>
</video>

<canvas id="canvas"></canvas>

</div>


<!-- AI RESULT -->

<div class="card">

<h2>Recognized Sign</h2>

<div id="result">
Loading AI...
</div>

<div id="confidence">
Please wait...
</div>

<button onclick="startCamera()">
📷 Start Camera
</button>

<div id="status">
Starting AI...
</div>

</div>


<!-- SENTENCE -->

<div class="card">

<h2>📝 Sentence</h2>

<div id="sentence" class="sentence">
Your sentence will appear here.
</div>

<br>

<button onclick="addSign()">
➕ Add Sign
</button>

<button onclick="clearSentence()">
🗑️ Clear
</button>

<button onclick="speakSentence()">
🔊 Speak
</button>

</div>


</div>


<script>

/* ==========================================
   ELEMENTS
========================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const result =
document.getElementById("result");

const confidence =
document.getElementById("confidence");

const status =
document.getElementById("status");

const sentenceBox =
document.getElementById("sentence");


/* ==========================================
   VARIABLES
========================================== */

let session = null;

let labels = [];

let cameraStarted = false;

let latestPrediction = "";

let sentence = [];

let predicting = false;


/* ==========================================
   MODEL SETTINGS
========================================== */

/*
   The model and labels are in the
   SAME folder as index.html.
*/

const MODEL_FILE =
"signbridge_model.onnx";

const LABEL_FILE =
"labels.json";


/* ==========================================
   LOAD LABELS
========================================== */

async function loadLabels() {

    const response =
    await fetch(
        LABEL_FILE + "?v=" + Date.now()
    );

    if (!response.ok) {

        throw new Error(
            "labels.json could not be loaded"
        );

    }

    labels =
    await response.json();


    if (!Array.isArray(labels)) {

        throw new Error(
            "labels.json is not an array"
        );

    }


    console.log(
        "Labels:",
        labels
    );

}


/* ==========================================
   LOAD ONNX MODEL
========================================== */

async function loadModel() {

    status.innerText =
    "Loading AI model...";


    /*
       Tell ONNX Runtime where its
       WebAssembly files are located.
    */

    ort.env.wasm.wasmPaths =
    "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";


    session =
    await ort.InferenceSession.create(
        MODEL_FILE,
        {
            executionProviders: ["wasm"]
        }
    );


    console.log(
        "Model loaded successfully"
    );


    console.log(
        "Inputs:",
        session.inputNames
    );


    console.log(
        "Outputs:",
        session.outputNames
    );

}


/* ==========================================
   LOAD EVERYTHING
========================================== */

async function loadAI() {

    try {

        result.innerText =
        "Loading AI...";


        await loadLabels();


        status.innerText =
        "Labels loaded ✅";


        await loadModel();


        status.innerText =
        "AI model ready ✅";


        result.innerText =
        "Show your hand ✋";


        confidence.innerText =
        "Ready";


    }

    catch (error) {

        console.error(
            "AI LOADING ERROR:",
            error
        );


        status.innerText =
        "AI loading error ❌";


        result.innerText =
        error.message ||
        String(error);


        confidence.innerText =
        "Check model and labels";

    }

}


/* ==========================================
   MEDIAPIPE HANDS
========================================== */

const hands =
new Hands({

    locateFile: function(file) {

        return (
            "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
            file
        );

    }

});


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


/* ==========================================
   HAND RESULTS
========================================== */

hands.onResults(
async function(results) {


    /* Canvas size */

    canvas.width =
    video.videoWidth;

    canvas.height =
    video.videoHeight;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* No hand */

    if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ) {

        result.innerText =
        "Show your hand ✋";

        confidence.innerText =
        "";

        return;

    }


    /* Hand found */

    const landmarks =
    results.multiHandLandmarks[0];


    /* Draw connections */

    drawConnectors(
        ctx,
        landmarks,
        HAND_CONNECTIONS,
        {
            color: "#00FF00",
            lineWidth: 4
        }
    );


    /* Draw points */

    drawLandmarks(
        ctx,
        landmarks,
        {
            color: "#FF0000",
            lineWidth: 2,
            radius: 5
        }
    );


    /*
       Don't predict until the
       model is loaded.
    */

    if (!session) {

        result.innerText =
        "AI is loading...";

        return;

    }


    /*
       Prevent overlapping predictions.
    */

    if (predicting) {

        return;

    }


    predicting = true;


    try {


        /* ======================================
           CREATE 63 FEATURES
        ====================================== */

        const features = [];


        for (
            let i = 0;
            i < landmarks.length;
            i++
        ) {

            features.push(
                landmarks[i].x
            );

            features.push(
                landmarks[i].y
            );

            features.push(
                landmarks[i].z
            );

        }


        if (features.length !== 63) {

            throw new Error(
                "Expected 63 features, got " +
                features.length
            );

        }


        /* ======================================
           CREATE INPUT TENSOR
        ====================================== */

        const input =
        new ort.Tensor(
            "float32",
            Float32Array.from(features),
            [1, 63]
        );


        /* ======================================
           RUN MODEL
        ====================================== */

        const output =
        await session.run({

            float_input:
            input

        });


        console.log(
            "Model output:",
            output
        );


        /* ======================================
           GET PREDICTION
        ====================================== */

        const labelOutput =
        output["output_label"];


        if (!labelOutput) {

            throw new Error(
                "output_label not found"
            );

        }


        const classIndex =
        Number(
            labelOutput.data[0]
        );


        console.log(
            "Predicted class:",
            classIndex
        );


        /* ======================================
           CLASS → LABEL
        ====================================== */

        if (
            classIndex >= 0 &&
            classIndex < labels.length
        ) {

            latestPrediction =
            labels[classIndex];


            result.innerText =
            latestPrediction;


            confidence.innerText =
            "AI prediction ✅";


            status.innerText =
            "Camera + AI running ✅";

        }

        else {

            result.innerText =
            "Unknown sign";

            confidence.innerText =
            "Unknown class";

        }


    }

    catch (error) {

        console.error(
            "PREDICTION ERROR:",
            error
        );


        result.innerText =
        "Prediction error ❌";


        confidence.innerText =
        error.message ||
        String(error);

    }


    predicting = false;

});


/* ==========================================
   START CAMERA
========================================== */

async function startCamera() {

    if (cameraStarted) {

        return;

    }


    try {

        status.innerText =
        "Opening camera...";


        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video: {
                facingMode: "user"
            },

            audio: false

        });


        video.srcObject =
        stream;


        await video.play();


        const camera =
        new Camera(

            video,

            {

                onFrame:
                async function() {

                    await hands.send({

                        image: video

                    });

                },

                width: 640,

                height: 480

            }

        );


        camera.start();


        cameraStarted =
        true;


        status.innerText =
        "Camera running ✅";


    }

    catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );


        status.innerText =
        "Camera error ❌";


        result.innerText =
        error.message ||
        String(error);

    }

}


/* ==========================================
   SENTENCE FUNCTIONS
========================================== */

function addSign() {

    if (
        latestPrediction === "" ||
        latestPrediction === "Unknown sign"
    ) {

        return;

    }


    sentence.push(
        latestPrediction
    );


    sentenceBox.innerText =
    sentence.join(" ");

}


function clearSentence() {

    sentence = [];


    sentenceBox.innerText =
    "Your sentence will appear here.";

}


function speakSentence() {

    if (
        sentence.length === 0
    ) {

        return;

    }


    const text =
    sentence.join(" ");


    const speech =
    new SpeechSynthesisUtterance(
        text
    );


    speech.lang =
    "en-IN";


    window.speechSynthesis.speak(
        speech
    );

}


/* ==========================================
   START AI
========================================== */

loadAI();

</script>

</body>

    </html>
