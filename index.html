<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SignBridge - Hand Detection</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #172033;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    font-size: 28px;
}

header p {
    margin-top: 6px;
    opacity: 0.8;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.camera-box {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: black;
    border-radius: 18px;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
}

.status {
    background: white;
    margin-top: 20px;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

#result {
    font-size: 25px;
    font-weight: bold;
    color: #2563eb;
    margin: 15px 0;
}

button {
    border: none;
    background: #2563eb;
    color: white;
    padding: 14px 25px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

.info {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
    line-height: 1.6;
}

.loading {
    margin-top: 10px;
    color: #666;
}
</style>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

</head>

<body>

<header>
    <h1>🤟 SignBridge</h1>
    <p>Sign Language → Text</p>
</header>

<div class="container">

    <div class="camera-box">

        <video id="video" autoplay playsinline></video>

        <canvas id="canvas"></canvas>

    </div>

    <div class="status">

        <h2>Hand Detection</h2>

        <div id="result">
            Camera not started
        </div>

        <button onclick="startCamera()">
            📷 Start Camera
        </button>

        <div class="loading" id="loading">
            AI model loading...
        </div>

    </div>

    <div class="info">

        <h3>Current Stage</h3>

        <p>
            SignBridge is currently learning to detect a human hand.
            Once hand detection works, we will use the detected hand
            landmarks to recognize sign language.
        </p>

    </div>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const result = document.getElementById("result");
const loading = document.getElementById("loading");

let cameraStarted = false;


/* -------------------------------
   MEDIAPIPE HAND MODEL
-------------------------------- */

const hands = new Hands({

    locateFile: (file) => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

});


hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 1,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


/* -------------------------------
   WHEN HAND IS DETECTED
-------------------------------- */

hands.onResults((results) => {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ) {

        result.innerText = "✋ Hand detected ✅";

        result.style.color = "#16a34a";


        /* Draw detected hand */

        for (
            const landmarks of results.multiHandLandmarks
        ) {

            drawConnectors(
                ctx,
                landmarks,
                HAND_CONNECTIONS,
                {
                    color: "#00FF00",
                    lineWidth: 4
                }
            );

            drawLandmarks(
                ctx,
                landmarks,
                {
                    color: "#FF0000",
                    lineWidth: 2,
                    radius: 5
                }
            );

        }

    } else {

        result.innerText = "No hand detected";

        result.style.color = "#2563eb";

    }

});


/* -------------------------------
   START CAMERA
-------------------------------- */

async function startCamera() {

    if (cameraStarted) {
        return;
    }

    try {

        loading.innerText =
            "Starting camera and AI...";

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user"
                },

                audio: false

            });


        video.srcObject = stream;


        const camera =
            new Camera(video, {

                onFrame: async () => {

                    await hands.send({
                        image: video
                    });

                },

                width: 640,

                height: 480

            });


        camera.start();


        cameraStarted = true;

        loading.innerText =
            "AI hand detection is running";


        result.innerText =
            "Show your hand ✋";

        result.style.color =
            "#2563eb";

    }

    catch (error) {

        console.error(error);

        result.innerText =
            "Camera permission denied ❌";

        loading.innerText =
            error.message;

    }

}

</script>

</body>
</html>
